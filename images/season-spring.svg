<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="春：柳枝、燕子和远山">
  <defs>
    <linearGradient id="springSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4e6"/>
      <stop offset="1" stop-color="#f8fcef"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#springSky)"/>
  <circle cx="112" cy="86" r="58" fill="#f3e9c7" opacity="0.85"/>

  <!-- 远山 -->
  <path d="M0 236 C 70 200 150 200 220 230 C 290 202 370 202 480 236 L480 320 L0 320 Z" fill="#cfe0bd"/>
  <path d="M0 268 C 100 246 200 248 300 270 C 380 252 440 254 480 268 L480 320 L0 320 Z" fill="#b7cf9f"/>

  <!-- 柳枝 -->
  <path d="M478 14 C 436 50 408 100 394 156 C 384 198 376 232 368 262"
        stroke="#8a6b45" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M452 40 C 426 86 414 136 412 190 C 411 216 408 238 404 256"
        stroke="#8a6b45" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M470 66 C 450 108 444 154 446 200"
