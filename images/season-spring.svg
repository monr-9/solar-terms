    <ellipse cx="448" cy="120" rx="4" ry="9" transform="rotate(18 448 120)"/>
    <ellipse cx="447" cy="144" rx="4" ry="9" transform="rotate(16 447 144)"/>
    <ellipse cx="448" cy="168" rx="4" ry="9" transform="rotate(14 448 168)"/>
    <ellipse cx="447" cy="192" rx="4" ry="9" transform="rotate(12 447 192)"/>
