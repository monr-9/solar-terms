    <ellipse cx="388" cy="208" rx="4.5" ry="10" transform="rotate(18 388 208)"/>
    <ellipse cx="382" cy="234" rx="4.5" ry="10" transform="rotate(16 382 234)"/>
    <ellipse cx="376" cy="258" rx="4.5" ry="10" transform="rotate(14 376 258)"/>
    <ellipse cx="420" cy="90" rx="4" ry="9" transform="rotate(-30 420 90)"/>
    <ellipse cx="414" cy="112" rx="4" ry="9" transform="rotate(-26 414 112)"/>
    <ellipse cx="414" cy="134" rx="4" ry="9" transform="rotate(-22 414 134)"/>
    <ellipse cx="412" cy="156" rx="4" ry="9" transform="rotate(-18 412 156)"/>
    <ellipse cx="410" cy="178" rx="4" ry="9" transform="rotate(-14 410 178)"/>
    <ellipse cx="408" cy="200" rx="4" ry="9" transform="rotate(-10 408 200)"/>
