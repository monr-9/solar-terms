  <!-- 飘落的花瓣 -->
  <g fill="#e9b7bd" opacity="0.9">
    <circle cx="252" cy="204" r="3"/>
    <circle cx="290" cy="150" r="2.4"/>
    <circle cx="330" cy="232" r="2.6"/>
    <circle cx="216" cy="256" r="2.2"/>
    <circle cx="356" cy="286" r="2.8"/>
