<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="冬：明月、雪坡与红梅">
  <defs>
    <linearGradient id="winterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eff2"/>
      <stop offset="1" stop-color="#f7fbfc"/>
    </linearGradient>

    <!-- 梅花 -->
    <g id="plum">
      <circle cx="0"   cy="-8.5" r="5.6" fill="#c34a44"/>
      <circle cx="8"   cy="-2.6" r="5.6" fill="#c34a44"/>
      <circle cx="5"   cy="7"    r="5.6" fill="#c34a44"/>
      <circle cx="-5"  cy="7"    r="5.6" fill="#c34a44"/>
      <circle cx="-8"  cy="-2.6" r="5.6" fill="#c34a44"/>
      <circle cx="0"   cy="0"    r="2.9" fill="#e9c46a"/>
    </g>
  </defs>

  <rect width="480" height="320" fill="url(#winterSky)"/>

  <!-- 月 -->
  <circle cx="368" cy="82" r="62" fill="#ffffff" opacity="0.45"/>
  <circle cx="368" cy="82" r="40" fill="#f6f2e4"/>
  <circle cx="352" cy="70" r="7" fill="#e9e3d1" opacity="0.6"/>
  <circle cx="378" cy="94" r="5" fill="#e9e3d1" opacity="0.5"/>

  <!-- 雪山 -->
  <path d="M0 250 C 100 218 200 222 300 252 C 380 226 440 228 480 250 L480 320 L0 320 Z" fill="#f8fbfc"/>
  <path d="M0 286 C 130 268 260 270 390 290 C 430 284 460 286 480 292 L480 320 L0 320 Z" fill="#e2edf1"/>

  <!-- 梅枝 -->
  <path d="M18 302 C 78 268 120 234 170 216 C 220 198 276 190 330 158"
        stroke="#5b4636" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M120 240 C 128 216 142 200 158 188"
        stroke="#5b4636" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M232 198 C 244 180 258 168 276 160"
        stroke="#5b4636" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M286 182 C 296 170 308 164 320 162"
        stroke="#5b4636" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 梅花 -->
  <use href="#plum" x="62"  y="288"/>
  <use href="#plum" x="94"  y="252"/>
  <use href="#plum" x="128" y="232"/>
  <use href="#plum" x="158" y="188"/>
  <use href="#plum" x="192" y="212"/>
  <use href="#plum" x="228" y="198"/>
  <use href="#plum" x="258" y="178"/>
  <use href="#plum" x="286" y="170"/>
  <use href="#plum" x="314" y="160"/>
  <use href="#plum" x="330" y="158"/>
  <g transform="translate(352 176) scale(0.8)"><use href="#plum"/></g>

  <!-- 落雪 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80"  cy="120" r="2.4"/>
    <circle cx="140" cy="70"  r="2"/>
    <circle cx="210" cy="130" r="2.6"/>
    <circle cx="266" cy="60"  r="2.2"/>
    <circle cx="300" cy="120" r="1.8"/>
    <circle cx="420" cy="190" r="2.4"/>
    <circle cx="450" cy="120" r="2"/>
    <circle cx="30"  cy="190" r="2.2"/>
    <circle cx="100" cy="170" r="1.8"/>
    <circle cx="360" cy="240" r="2.4"/>
  </g>
</svg>
