  <ellipse cx="150" cy="252" rx="52" ry="11" fill="#9cc4a7" opacity="0.7"/>

  <ellipse cx="374" cy="274" rx="62" ry="17" fill="#7fae8c"/>
  <path d="M374 274 L402 262" stroke="#6d9b7b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 花茎 -->
  <path d="M302 252 C 298 220 302 190 302 166" stroke="#6f9a78" stroke-width="4.5" fill="none"/>
  <path d="M336 258 C 340 234 342 212 344 198" stroke="#6f9a78" stroke-width="3.5" fill="none"/>

  <!-- 荷花 -->
  <g>
    <g transform="rotate(0 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#e8a3ae"/></g>
    <g transform="rotate(60 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#f0bcc4"/></g>
    <g transform="rotate(120 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#e8a3ae"/></g>
    <g transform="rotate(180 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#f0bcc4"/></g>
    <g transform="rotate(240 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#e8a3ae"/></g>
    <g transform="rotate(300 302 158)"><ellipse cx="302" cy="130" rx="9" ry="27" fill="#f0bcc4"/></g>
    <circle cx="302" cy="158" r="11" fill="#f2d27a"/>
    <circle cx="302" cy="158" r="5" fill="#e0b352"/>
