<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="夏：荷花、荷叶与池塘">
  <defs>
    <linearGradient id="summerSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2ec"/>
      <stop offset="1" stop-color="#f8fcf6"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2dcd4"/>
      <stop offset="1" stop-color="#b4d2ca"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#summerSky)"/>
  <circle cx="392" cy="74" r="52" fill="#f7e8bf" opacity="0.9"/>
  <circle cx="392" cy="74" r="30" fill="#f6e3ac" opacity="0.8"/>

  <!-- 远处坡地 -->
  <path d="M0 246 C 90 222 180 224 270 246 C 350 226 420 228 480 246 L480 320 L0 320 Z" fill="#cee3d2"/>

  <!-- 池塘 -->
  <path d="M0 274 L480 274 L480 320 L0 320 Z" fill="url(#pond)"/>
  <g stroke="#ffffff" opacity="0.55" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M36 292 q 16 -5 32 0 q 16 5 32 0"/>
    <path d="M296 302 q 14 -4 28 0 q 14 4 28 0"/>
    <path d="M392 286 q 12 -4 24 0 q 12 4 24 0"/>
  </g>

  <!-- 荷叶 -->
  <ellipse cx="146" cy="258" rx="88" ry="24" fill="#8cb798"/>
